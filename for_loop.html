<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Loops</h1>
<h2>The for Loop</h2>

<p id="demo"></p>

<script>
let text= "";
const cars = ["BMW", "Volvo", "Saab", "Ford", "Fiat", "Audi"];
for (let i=0; i<cars.length; i++){
  text += cars[i] + "<br>";
}

/*let text = "";
for (let i = 0; i < cars.length; i++) {
  text += cars[i] + "<br>";
}*/

document.getElementById("demo").innerHTML = text; 
</script>

</body>
</html>
